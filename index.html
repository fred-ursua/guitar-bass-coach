<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Guitar & Bass Practice Lab</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">PRACTICE • BUILD • LOOP</p><h1>Guitar & Bass Practice Lab</h1></div>
    <div class="instrument-switch" aria-label="Instrument">
      <button data-instrument="guitar">🎸 Guitar</button><button data-instrument="bass">🎵 Bass</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Main navigation">
    <button data-view="home">Home</button><button data-view="practice">Practice</button><button data-view="exercises">Exercises</button><button data-view="progress">Progress</button><button data-view="songs">Songs</button>
  </nav>
  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="tab-composer.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
